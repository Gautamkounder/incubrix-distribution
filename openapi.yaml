openapi: 3.1.0
info:
  title: IncuBrix Long-Tail Distribution
  description: 'Connector service: publishes content to forums, blogs and partner
    sites with safe retries.'
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - ops
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready Ready Get
  /api/v1/health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/ready:
    get:
      tags:
      - ops
      summary: Ready
      operationId: ready_api_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready Api V1 Ready Get
  /api/v1/connectors:
    get:
      tags:
      - connectors
      summary: List Connectors
      operationId: list_connectors_api_v1_connectors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Connectors Api V1 Connectors Get
  /api/v1/publish:
    post:
      tags:
      - publish
      summary: Publish
      operationId: publish_api_v1_publish_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - publish
      summary: Get Job
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/files/{path}:
    get:
      tags:
      - files
      summary: Get File
      operationId: get_file_api_v1_files__path__get
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/{method}:
    post:
      tags:
      - connector-contract
      summary: Call Connector
      operationId: call_connector_connector_v1__connector_key___method__post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      - name: method
        in: path
        required: true
        schema:
          type: string
          title: Method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Call Connector Connector V1  Connector Key   Method  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Destination:
      properties:
        id:
          type: string
          title: Id
        connector_key:
          type: string
          title: Connector Key
        surface:
          anyOf:
          - type: string
          - type: 'null'
          title: Surface
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        config:
          additionalProperties: true
          type: object
          title: Config
      type: object
      required:
      - id
      - connector_key
      title: Destination
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobAccepted:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        status_url:
          type: string
          title: Status Url
      type: object
      required:
      - job_id
      - status
      - status_url
      title: JobAccepted
    JobStatus:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        progress:
          type: integer
          title: Progress
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error
        links:
          additionalProperties:
            type: string
          type: object
          title: Links
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - job_id
      - status
      - progress
      - created_at
      - updated_at
      title: JobStatus
    PublishRequest:
      properties:
        rendition:
          $ref: '#/components/schemas/Rendition'
        targets:
          items:
            $ref: '#/components/schemas/PublishTarget'
          type: array
          maxItems: 50
          minItems: 1
          title: Targets
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      required:
      - rendition
      - targets
      title: PublishRequest
    PublishTarget:
      properties:
        destination:
          $ref: '#/components/schemas/Destination'
        connection:
          additionalProperties: true
          type: object
          title: Connection
      type: object
      required:
      - destination
      title: PublishTarget
    Rendition:
      properties:
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
        canonical_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Url
        tags:
          items:
            type: string
          type: array
          title: Tags
        media_urls:
          items:
            type: string
          type: array
          title: Media Urls
        language:
          type: string
          title: Language
          default: en
        is_promotional:
          type: boolean
          title: Is Promotional
          default: false
        ai_generated:
          type: boolean
          title: Ai Generated
          default: false
      type: object
      required:
      - title
      - body
      title: Rendition
      description: The content to publish, already adapted for one destination (tailoring
        comes later).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
