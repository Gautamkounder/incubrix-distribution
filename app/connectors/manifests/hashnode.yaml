key: hashnode
version: 1.0.0
tier: native
auth: bearer
surfaces:
  - key: post
    content_types: [text, image]
    spec: {title_max_chars: 120, links_allowed: true}
rate_limits:
  per_connection: {requests: 30, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
instance_param: endpoint
