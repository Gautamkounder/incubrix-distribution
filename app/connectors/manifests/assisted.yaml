key: assisted
version: 1.0.0
tier: assisted
auth: none
surfaces:
  - key: post
    content_types: [text, image, video_link]
    spec: {title_max_chars: 300, body_max_chars: 40000, links_allowed: true}
rate_limits:
  per_connection: {requests: 60, per_seconds: 60}
capabilities: [assist]
error_map: {}
instance_param: submit_url
