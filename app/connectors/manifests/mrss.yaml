key: mrss
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: feed
    content_types: [text, link]
    spec: {title_max_chars: 200, links_allowed: true}
rate_limits:
  per_connection: {requests: 50, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "401": CONNECTION_AUTH_EXPIRED
instance_param: endpoint
