key: slack
version: 1.0.0
tier: native
auth: bearer
surfaces:
  - key: channel
    content_types: [text]
    spec: {title_max_chars: 100, body_max_chars: 3000, links_allowed: true}
rate_limits:
  per_connection: {requests: 1, per_seconds: 1}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
instance_param: endpoint
